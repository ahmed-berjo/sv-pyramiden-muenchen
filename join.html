<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Us — SV Pyramiden München</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="Logo-removebg-preview.png" alt="SV Pyramiden München" class="nav-logo" />
        <div class="nav-brand-text">
          <span class="nav-title">SV Pyramiden</span>
          <span class="nav-sub" data-i18n="nav_sub">Munich</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="index.html#about" data-i18n="nav_club">Club</a></li>
        <li><a href="index.html#squad" data-i18n="nav_squad">Squad</a></li>
        <li><a href="join.html" class="active" data-i18n="nav_join">Join Us</a></li>
        <li><a href="index.html#contact" data-i18n="nav_contact">Contact</a></li>
      </ul>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="en">EN</button>
        <span>|</span>
        <button class="lang-btn" data-lang="de">DE</button>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Join Hero -->
  <section class="join-hero">
    <div class="container">
      <p class="section-eyebrow" data-i18n="join_eyebrow">Become a Player</p>
      <h1 data-i18n="join_title">Join Us</h1>
      <p class="join-hero-desc" data-i18n="join_desc">Think you have what it takes? Fill in the form and we'll get back to you.</p>
    </div>
  </section>

  <!-- Join Form -->
  <section class="join-form-section">
    <div class="container">
      <form class="join-form" action="https://formspree.io/f/maqvnqae" method="POST">
        <input type="hidden" name="_subject" value="New Player Registration" />

        <div class="form-group">
          <label for="join-name" data-i18n="join_name">Full Name</label>
          <input type="text" id="join-name" name="Full Name" required />
        </div>

        <div class="form-group">
          <label for="join-dob" data-i18n="join_dob">Date of Birth</label>
          <input type="date" id="join-dob" name="Date of Birth" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="join-height" data-i18n="join_height">Height (cm)</label>
            <input type="number" id="join-height" name="Height (cm)" required />
          </div>
          <div class="form-group">
            <label for="join-weight" data-i18n="join_weight">Weight (kg)</label>
            <input type="number" id="join-weight" name="Weight (kg)" required />
          </div>
        </div>

        <div class="form-group">
          <label for="join-phone" data-i18n="join_phone">Phone Number</label>
          <input type="tel" id="join-phone" name="Phone" required />
        </div>

        <div class="form-group">
          <label for="join-email" data-i18n="join_email">Email</label>
          <input type="email" id="join-email" name="Email" required />
        </div>

        <div class="form-group">
          <label data-i18n="join_prev">Have you previously played in an 11-side football team?</label>
          <div class="radio-row">
            <label><input type="radio" name="Previous 11-side" value="Yes" id="prev-yes" /> <span data-i18n="join_yes">Yes</span></label>
            <label><input type="radio" name="Previous 11-side" value="No" id="prev-no" checked /> <span data-i18n="join_no">No</span></label>
          </div>
        </div>

        <div id="prev-details" class="prev-details hidden">
          <div class="form-group">
            <label for="join-club" data-i18n="join_club">Club / Team Name</label>
            <input type="text" id="join-club" name="Previous Club" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="join-from" data-i18n="join_from">From</label>
              <input type="text" id="join-from" name="Period From" placeholder="e.g. 2020" />
            </div>
            <div class="form-group">
              <label for="join-to" data-i18n="join_to">To</label>
              <input type="text" id="join-to" name="Period To" placeholder="e.g. 2023" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="join-pos1" data-i18n="join_pos1">Main Position</label>
              <select id="join-pos1" name="Main Position">
                <option value="Goalkeeper">Goalkeeper</option>
                <option value="Defender">Defender</option>
                <option value="Midfielder">Midfielder</option>
                <option value="Forward">Forward</option>
              </select>
            </div>
            <div class="form-group">
              <label for="join-pos2" data-i18n="join_pos2">Secondary Position</label>
              <select id="join-pos2" name="Secondary Position">
                <option value="None">None</option>
                <option value="Goalkeeper">Goalkeeper</option>
                <option value="Defender">Defender</option>
                <option value="Midfielder">Midfielder</option>
                <option value="Forward">Forward</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="join_registered">Are you currently registered with another club?</label>
            <div class="radio-row">
              <label><input type="radio" name="Currently Registered" value="Yes" /> <span data-i18n="join_yes">Yes</span></label>
              <label><input type="radio" name="Currently Registered" value="No" checked /> <span data-i18n="join_no">No</span></label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary full" data-i18n="join_submit">Submit Application</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="Logo-removebg-preview.png" alt="SV Pyramiden München" />
          <div>
            <strong>SV Pyramiden München</strong>
            <span data-i18n="footer_founded">Founded 2025</span>
          </div>
        </div>
        <p class="footer-copy" data-i18n="footer_copy">&copy; 2025 SV Pyramiden München. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
